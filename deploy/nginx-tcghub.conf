# /etc/nginx/sites-available/tcghub  (troque seudominio.com.br pelo seu domínio)
# O certbot acrescenta o bloco HTTPS (443) e o redirecionamento depois.

# Limites por IP, antes de chegar ao app (o app ainda limita por conta).
limit_req_zone $binary_remote_addr zone=tcghub_site:10m rate=10r/s;
limit_req_zone $binary_remote_addr zone=tcghub_auth:10m rate=10r/m;
limit_req_zone $binary_remote_addr zone=tcghub_scan:10m rate=6r/m;
limit_req_status 429;

upstream tcghub_app {
    server 127.0.0.1:8000;
    keepalive 16;
}

# Acesso pelo IP ou por domínio desconhecido: conexão encerrada sem resposta.
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;
    return 444;
}
server {
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;
    server_name _;
    ssl_reject_handshake on;
}

server {
    listen 80;
    listen [::]:80;
    server_name seudominio.com.br www.seudominio.com.br;

    server_tokens off;
    # Mesmo teto do Flask (MAX_CONTENT_LENGTH) para as fotos do scan.
    client_max_body_size 10m;
    client_body_timeout 30s;

    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host $host;
    proxy_read_timeout 65s;

    # Arquivos estáticos direto do disco, sem passar pelo gunicorn.
    location /static/ {
        alias /srv/tcghub/app/static/;
        expires 1h;
        access_log off;
    }

    # Cada scan custa uma chamada ao Gemini.
    location = /scan {
        limit_req zone=tcghub_scan burst=5 nodelay;
        proxy_pass http://tcghub_app;
    }

    # Login e token do chat: tentativas por minuto.
    location /api/auth/ {
        limit_req zone=tcghub_auth burst=10 nodelay;
        proxy_pass http://tcghub_app;
    }

    location / {
        limit_req zone=tcghub_site burst=40 nodelay;
        proxy_pass http://tcghub_app;
    }
}